[project]
name = "incident-triage"
version = "0.1.0"
description = "Search over past incidents plus a grounded LLM triage assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=3.0",  # v3 runs on httpx2; the adapter and its tests depend on that
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "httpx2>=2.16.0",
]
ui = [
    "httpx>=0.28.1",
    "streamlit>=1.67.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: calls the real LLM (needs LLM_API_KEY); run with `make test-live`",
    "ui: drives the Streamlit UI against a running API (`make run`); run with `make test-ui`",
]
addopts = "-m 'not live and not ui'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# long template strings in the generator's data table; wrapping them hurts readability
"scripts/generate_incidents.py" = ["E501"]
# the UI's overview table is long rows of copy text inside one string
"ui/app.py" = ["E501"]
